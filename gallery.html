<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link rel="stylesheet" href="bat.css">
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(to right, #eef2f3, #dfe9f3);
}

header {
  background: #FF4F4F;
  color: white;
  padding: 20px;
  text-align: center;
}

nav {
  margin-top: 10px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
  padding: 8px 14px;
  border-radius: 6px;
  transition: background 0.3s;
}

nav a:hover {
  background: #555;
}

.gallery-container {
  padding: 30px;
}

.gallery-container h2 {
  text-align: center;
  margin-bottom: 20px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.gallery-item {
  background: white;
  padding: 10px;
  border-radius: 15px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.15);
  transition: transform 0.3s;
}

.gallery-item:hover {
  transform: translateY(-5px);
}

.gallery-item img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
}

footer {
  text-align: center;
  background: #222;
  color: white;
  padding: 15px;
  margin-top: 20px;
}
</style>
</head>
<body>

<header>
<h1>Gallery</h1>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="diary.html">Diary</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<section class="gallery-container">
<h2>My Memories 📸</h2>

<div class="gallery-grid">

<div class="gallery-item"><img src="Image 1.jpg" alt="Gallery Image 1"></div>
<div class="gallery-item"><img src="Image 2.jpg" alt="Gallery Image 2"></div>
<div class="gallery-item"><img src="Image 3.jpg" alt="Gallery Image 3"></div>


</div>
</section>

<footer>
<p>&copy; 2026 My College Diary | Created by Juan Karlito Labitoria</p>
</footer>

</body>
</html>
